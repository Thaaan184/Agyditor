<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kinetic 3D Spatial Motif</title>
<style>
  @font-face {
    font-family: "Inter Tight";
    src: url("./fonts/InterTight-Latin.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
  }
  @font-face {
    font-family: "Instrument Serif";
    src: url("./fonts/InstrumentSerif.ttf") format("truetype");
    font-weight: 400;
    font-style: italic;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("./fonts/JetBrainsMono-Latin.woff2") format("woff2");
    font-weight: 100 800;
    font-style: normal;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .stage.ambient-dark {
    background:
      radial-gradient(64% 48% at 50% 42%, rgba(14, 165, 233, 0.14), transparent 72%),
      radial-gradient(88% 72% at 24% 78%, rgba(248, 250, 252, 0.05), transparent 64%),
      #0B0F17;
  }
  .plane {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: center center;
    white-space: nowrap;
    will-change: transform, opacity, filter;
  }
  .lead {
    font-family: "Inter Tight", sans-serif;
    font-weight: 300;
    font-size: 46px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }
  .mixed-hero {
    display: flex;
    align-items: baseline;
    gap: 24px;
    font-family: "Inter Tight", sans-serif;
    font-size-adjust: from-font;
  }
  @supports not (font-size-adjust: from-font) {
    .mixed-hero {
      line-height: 1.04;
    }
  }
  .hero-sans {
    font-family: "Inter Tight", sans-serif;
    font-weight: 800;
    font-size: 122px;
    letter-spacing: -0.04em;
    line-height: 0.94;
    text-shadow: 0 22px 48px rgba(0, 0, 0, 0.56);
  }
  .hero-serif {
    font-family: "Instrument Serif", serif;
    font-weight: 400;
    font-style: italic;
    font-size: 132px;
    letter-spacing: -0.015em;
    line-height: 0.96;
    text-shadow: 0 22px 48px rgba(0, 0, 0, 0.48);
  }
  .telemetry {
    font-family: "JetBrains Mono", monospace;
    font-weight: 500;
    font-size: 24px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
</style>
<script src="./motion_primitives.js"></script>
</head>
<body>
<div id="stage" class="stage"></div>
<script>
(function () {
  var planes = {};
  var cfg = null;

  function placePlane(el, camZ, wordZ, focalZ, xOffsetPx, yOffsetPx, enterAlpha) {
    var cam = AGYMotion.spatial3DCameraWord(camZ, wordZ, {
      focalZ: focalZ,
      dofRange: 410,
      maxDofBlurPx: 9.5,
      baseFocalDist: 920
    });
    var op = Math.max(0, Math.min(1, cam.opacity * enterAlpha));
    el.style.opacity = op.toFixed(4);
    el.style.transform =
      "translate3d(-50%,-50%,0) " +
      "translate3d(" + (xOffsetPx * cam.perspectiveScale).toFixed(2) + "px," +
      (yOffsetPx * cam.perspectiveScale).toFixed(2) + "px,0) " +
      "scale(" + cam.perspectiveScale.toFixed(4) + ")";
    el.style.filter = cam.dofBlurPx > 0.1 ? "blur(" + cam.dofBlurPx.toFixed(2) + "px)" : "none";
  }

  function renderFrame(t) {
    if (!cfg) return;
    var pushCue = Number(cfg.cue_push_s) || 1.15;
    var uIntro = AGYMotion.CURVES.appleOut(AGYMotion.clamp01(t / 0.52));
    var uPush = AGYMotion.CURVES.fusionEase85(AGYMotion.clamp01((t - pushCue) / 0.92));

    var camZ = AGYMotion.lerp(-640, -120, uIntro) + AGYMotion.lerp(0, 340, uPush);
    var focalZ = AGYMotion.lerp(240, -40, uIntro) + AGYMotion.lerp(0, -140, uPush);

    var aLead = AGYMotion.smoothstep(0.0, 0.25, t);
    var aHero = AGYMotion.smoothstep(0.12, 0.42, t);
    var aSub = AGYMotion.smoothstep(0.32, 0.68, t);

    placePlane(planes.lead, camZ, 260, focalZ, 0, -155, aLead);
    placePlane(planes.hero, camZ, 0, focalZ, 0, -8, aHero);
    placePlane(planes.sub, camZ, -260, focalZ, 0, 148, aSub);
  }

  motif.define({
    async setup(props, ctx) {
      cfg = props;
      await document.fonts.load('800 122px "Inter Tight"');
      await document.fonts.load('300 46px "Inter Tight"');
      await document.fonts.load('italic 400 132px "Instrument Serif"');
      await document.fonts.load('500 24px "JetBrains Mono"');

      var stage = document.getElementById("stage");
      stage.replaceChildren();
      stage.className = "stage" + (props.ground_mode === "ambient_dark" ? " ambient-dark" : "");

      var ink = props.ink || "#F8FAFC";
      var accent = props.accent || "#0EA5E9";

      var leadEl = document.createElement("div");
      leadEl.className = "plane lead";
      leadEl.style.color = ink;
      leadEl.textContent = String(props.lead_text || "BUILT FOR");

      var heroEl = document.createElement("div");
      heroEl.className = "plane mixed-hero";
      var heroSans = document.createElement("span");
      heroSans.className = "hero-sans";
      heroSans.style.color = ink;
      heroSans.textContent = String(props.hero_text || "CINEMA");
      var heroSerif = document.createElement("span");
      heroSerif.className = "hero-serif";
      heroSerif.style.color = accent;
      heroSerif.textContent = String(props.accent_serif || "precision");
      heroEl.appendChild(heroSans);
      heroEl.appendChild(heroSerif);

      var subEl = document.createElement("div");
      subEl.className = "plane telemetry";
      subEl.style.color = "#94A3B8";
      subEl.textContent = String(props.sub_label || "1080P / 60FPS LOCAL PIPELINE");

      stage.appendChild(leadEl);
      stage.appendChild(heroEl);
      stage.appendChild(subEl);

      planes = { lead: leadEl, hero: heroEl, sub: subEl };
      renderFrame(0, ctx);
    },
    frame(t, ctx) {
      renderFrame(t, ctx);
    }
  });
}());
</script>
</body>
</html>
