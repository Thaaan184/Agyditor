<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple Follower Reveal Motif</title>
<style>
  @font-face {
    font-family: "Inter Tight";
    src: url("./fonts/InterTight-Latin.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
  }
  @font-face {
    font-family: "Inter";
    src: url("./fonts/Inter.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  .stage {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 24px 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .stage.align-left {
    align-items: flex-start;
  }
  .headline {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.26em;
    font-family: "Inter Tight", "Inter", sans-serif;
    font-weight: 800;
    font-size: 86px;
    line-height: 0.98;
    letter-spacing: -0.04em;
    font-size-adjust: from-font;
    will-change: transform, opacity, filter;
  }
  @supports not (font-size-adjust: from-font) {
    .headline {
      font-size: 86px;
      line-height: 1.02;
    }
  }
  .stage.align-left .headline {
    justify-content: flex-start;
  }
  .word {
    display: inline-flex;
    white-space: pre;
  }
  .char {
    display: inline-block;
    will-change: transform, opacity, filter;
  }
  .sub {
    margin-top: 18px;
    font-family: "Inter", sans-serif;
    font-weight: 500;
    font-size: 24px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    will-change: transform, opacity, filter;
  }
</style>
<script src="./motion_primitives.js"></script>
</head>
<body>
<div id="stage" class="stage"></div>
<script>
(function () {
  var chars = [];
  var subEl = null;
  var cfg = null;

  function renderFrame(t) {
    if (!cfg) return;
    var staggerS = (Number(cfg.stagger_ms) || 34) / 1000;
    for (var i = 0; i < chars.length; i++) {
      var st = AGYMotion.appleFollowerChar(t, 0.04, i, {
        staggerS: staggerS,
        durationS: 0.38,
        riseEm: -0.3,
        startBlurPx: 6,
        maxShadowAlpha: 0.52,
        startScale: 0.96
      });
      var el = chars[i];
      el.style.opacity = st.opacity.toFixed(4);
      el.style.transform = "translate3d(0," + st.translateYEm.toFixed(4) + "em,0) scale(" + st.scale.toFixed(4) + ")";
      el.style.filter = st.blurPx > 0.05 ? "blur(" + st.blurPx.toFixed(2) + "px)" : "none";
      el.style.textShadow = "0 12px 26px rgba(0, 0, 0, " + st.shadowAlpha.toFixed(3) + ")";
    }
    if (subEl) {
      var subDelay = 0.08 + Math.min(chars.length, 14) * staggerS * 0.55;
      var k = AGYMotion.kinetic20Move("tracking-expand", t, subDelay, {
        durationS: 0.48,
        targetTrackingEm: 0.14
      });
      subEl.style.opacity = k.opacity.toFixed(4);
      subEl.style.letterSpacing = k.letterSpacingEm.toFixed(4) + "em";
      subEl.style.transform = "scale(" + k.scale.toFixed(4) + ")";
      subEl.style.filter = k.blurPx > 0.05 ? "blur(" + k.blurPx.toFixed(2) + "px)" : "none";
    }
  }

  motif.define({
    async setup(props, ctx) {
      cfg = props;
      await document.fonts.load('800 86px "Inter Tight"');
      await document.fonts.load('500 24px "Inter"');

      var stage = document.getElementById("stage");
      stage.replaceChildren();
      chars = [];
      stage.className = "stage" + (props.align === "left" ? " align-left" : "");

      var headline = document.createElement("div");
      headline.className = "headline";
      headline.style.color = props.ink || "#F8FAFC";

      var rawWords = String(props.text || "MOTION WITH PURPOSE").trim().split(/\s+/);
      for (var w = 0; w < rawWords.length; w++) {
        var wordEl = document.createElement("span");
        wordEl.className = "word";
        var token = rawWords[w];
        var isAccent = w === rawWords.length - 1 && rawWords.length > 1;
        if (isAccent) wordEl.style.color = props.accent || "#0EA5E9";
        for (var c = 0; c < token.length; c++) {
          var chEl = document.createElement("span");
          chEl.className = "char";
          chEl.textContent = token[c];
          wordEl.appendChild(chEl);
          chars.push(chEl);
        }
        headline.appendChild(wordEl);
      }
      stage.appendChild(headline);

      if (props.subtitle && String(props.subtitle).trim() !== "") {
        subEl = document.createElement("div");
        subEl.className = "sub";
        subEl.style.color = props.ink || "#F8FAFC";
        subEl.textContent = String(props.subtitle);
        stage.appendChild(subEl);
      } else {
        subEl = null;
      }

      renderFrame(0, ctx);
    },
    frame(t, ctx) {
      renderFrame(t, ctx);
    }
  });
}());
</script>
</body>
</html>
