<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghost Echo Kinetic Motif</title>
<style>
  @font-face {
    font-family: "Inter Tight";
    src: url("./fonts/InterTight-Latin.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
  }
  @font-face {
    font-family: "Inter Tight";
    src: url("./fonts/InterTight-Italic.woff2") format("woff2");
    font-weight: 100 900;
    font-style: italic;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .phrase-layer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Inter Tight", sans-serif;
    font-weight: 800;
    font-size: 96px;
    letter-spacing: -0.04em;
    line-height: 0.96;
    text-align: center;
    will-change: transform, opacity, filter;
    text-shadow: 0 14px 30px rgba(0, 0, 0, 0.52);
  }
  .phrase-layer .accent-span {
    font-style: italic;
    margin-left: 0.18em;
  }
</style>
<script src="./motion_primitives.js"></script>
</head>
<body>
<div id="stage" class="stage"></div>
<script>
(function () {
  var layers = {};
  var cfg = null;

  function buildPhraseDom(phrase, accentWord, ink, accent) {
    var el = document.createElement("div");
    el.className = "phrase-layer";
    el.style.color = ink;
    var words = String(phrase || "").trim().split(/\s+/);
    var accentUpper = String(accentWord || "").trim().toUpperCase();
    for (var i = 0; i < words.length; i++) {
      var span = document.createElement("span");
      var w = words[i];
      if (i > 0) span.style.marginLeft = "0.24em";
      if (accentUpper && w.toUpperCase() === accentUpper) {
        span.className = "accent-span";
        span.style.color = accent;
      }
      span.textContent = w;
      el.appendChild(span);
    }
    return el;
  }

  function applyTransform(el, st, exitAlpha) {
    var op = Math.max(0, Math.min(1, st.opacity * exitAlpha));
    el.style.opacity = op.toFixed(4);
    el.style.transform = "translate3d(" + st.translateX.toFixed(2) + "px,0,0) scale(" + st.scale.toFixed(4) + ")";
    el.style.filter = st.blurPx > 0.05 ? "blur(" + st.blurPx.toFixed(2) + "px)" : "none";
  }

  function renderFrame(t, ctx) {
    if (!cfg) return;
    var dur = Number(cfg.duration_s) || (ctx && ctx.duration) || 3.5;
    var swapT = Math.min(dur - 0.7, Math.max(0.25, Number(cfg.cue_swap_s) || 1.15));
    var echoMax = Number(cfg.echo_opacity) || 0.2;

    var exitStart = Math.max(swapT + 0.4, dur - 0.35);
    var exitFade = 1 - AGYMotion.smoothstep(exitStart, dur, t);

    var p1In = AGYMotion.ghostEchoPair(t, 0.02, {
      durationS: 0.44,
      slideDistancePx: -56,
      echoOpacity: echoMax
    });

    if (t < swapT) {
      applyTransform(layers.p1Ghost, p1In.ghost, exitFade);
      applyTransform(layers.p1Main, p1In.incoming, exitFade);
      layers.p2Ghost.style.opacity = "0";
      layers.p2Main.style.opacity = "0";
      return;
    }

    var swapPair = AGYMotion.ghostEchoPair(t, swapT, {
      durationS: 0.46,
      slideDistancePx: 84,
      echoOpacity: echoMax,
      ghostScaleMax: 1.46,
      ghostDriftPx: -42,
      ghostBlurMax: 18
    });

    applyTransform(layers.p1Main, swapPair.ghost, exitFade);
    layers.p1Ghost.style.opacity = "0";

    var p2Echo = {
      opacity: swapPair.ghost.opacity * 0.85,
      scale: swapPair.incoming.scale * 1.12,
      translateX: swapPair.incoming.translateX + 26,
      blurPx: swapPair.incoming.blurPx + 7
    };
    applyTransform(layers.p2Ghost, p2Echo, exitFade);
    applyTransform(layers.p2Main, swapPair.incoming, exitFade);
  }

  motif.define({
    async setup(props, ctx) {
      cfg = props;
      await document.fonts.load('800 96px "Inter Tight"');
      await document.fonts.load('italic 800 96px "Inter Tight"');

      var stage = document.getElementById("stage");
      stage.replaceChildren();

      var ink = props.ink || "#F8FAFC";
      var accent = props.accent || "#0EA5E9";

      layers.p1Ghost = buildPhraseDom(props.first_phrase || "SHARP CUTS", "", ink, accent);
      layers.p1Main = buildPhraseDom(props.first_phrase || "SHARP CUTS", "", ink, accent);
      layers.p2Ghost = buildPhraseDom(props.second_phrase || "ZERO NOISE", props.accent_word, ink, accent);
      layers.p2Main = buildPhraseDom(props.second_phrase || "ZERO NOISE", props.accent_word, ink, accent);

      stage.appendChild(layers.p1Ghost);
      stage.appendChild(layers.p1Main);
      stage.appendChild(layers.p2Ghost);
      stage.appendChild(layers.p2Main);

      renderFrame(0, ctx);
    },
    frame(t, ctx) {
      renderFrame(t, ctx);
    }
  });
}());
</script>
</body>
</html>
